name: Build & Release

# ⚠️ branches 与 tags 必须写在**同一个** push 键下；
#    写两个 `push:` 后者会静默覆盖前者。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # 发 Release 需要

jobs:
  build:
    # ★ CI 只出「安装版 + 绿色版」两个产物（用户要求：GitHub 不要单文件便携版）。
    #   本机 `npm run dist` 仍然是 nsis + portable + dir 三个，两边只有产物集合不同。
    name: 打包（安装版 / 绿色版）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 装依赖
        shell: bash
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci

      # 干净机器上 electron 的 postinstall 可能被 npm 的 allow-scripts 门控跳过，
      # 于是 build.electronDist 指向的目录根本不存在 → electron-builder 直接报
      # "The specified electronDist does not exist"。这一步幂等，已装过会秒退。
      - name: 补齐 Electron 运行时（electronDist）
        shell: bash
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          if [ -f node_modules/electron/dist/electron.exe ]; then
            echo "electron/dist 已存在，跳过"
          else
            node node_modules/electron/install.js
          fi
          test -f node_modules/electron/dist/electron.exe \
            || { echo "::error::electronDist 下载后仍不存在，请检查 ELECTRON_MIRROR"; exit 1; }

      - name: 静态自检（语法 + 主进程逻辑）
        shell: bash
        run: |
          npm run check
          npm run test
          # 退出后助手（PowerShell 换文件那段）必须**真的跑一遍**：
          # 任何静态断言都证不了"它真的等了进程退出""真的没碰 data/"。
          npm run verify:apply

      - name: 打包
        shell: bash
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        # 没有 portable：单文件便携版只在本地构建，不进 Release（用户要求）。
        run: npx electron-builder --win nsis dir --x64 --publish never

      - name: 压绿色版 zip
        shell: bash
        run: |
          node scripts/pack-green.mjs \
            --src ../dist/win-unpacked \
            --need QuickLaunch.exe,resources/app.asar,resources/icon.ico

      # action 的 path 里**绝对不能有 `..`**：@actions/glob 的 fixupPattern
      # 只要见到 `..` 就断言失败。也不能用 $(pwd)（Git Bash 给的是 MSYS 风格 /d/a/...）。
      # cygpath -w -a 一步拿到原生 Windows 路径并消掉 `..`。
      - name: 计算产物路径 + 防回归断言
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cd ../dist
          RELEASE_DIR="$(cygpath -w -a "$(pwd)")"

          case "$RELEASE_DIR" in
            *".."*)            echo "::error::RELEASE_DIR 仍含 ..：$RELEASE_DIR"; exit 1 ;;
            [A-Za-z]:\\*)      ;;
            *)                 echo "::error::RELEASE_DIR 不是原生 Windows 路径：$RELEASE_DIR"; exit 1 ;;
          esac

          SETUP="QuickLaunch-Setup-${VERSION}.exe"
          GREEN="QuickLaunch-Green-${VERSION}.zip"

          # 文件名不得含空格：GitHub 会把 Release 资产名里的空格换成点，从 action 侧治不了
          for f in "$SETUP" "$GREEN"; do
            case "$f" in *" "*) echo "::error::资产名含空格：$f"; exit 1 ;; esac
            test -f "$f" || { echo "::error::产物缺失：$RELEASE_DIR\\$f"; exit 1; }
          done

          # 反向守卫：CI 不该再产出单文件便携版。它一旦出现，就说明「打包」那步
          # 被人改回了 --win nsis portable dir，而 Release 是照 SETUP/GREEN 两行取的 ——
          # 那种"构建了但不发布"的静默不一致必须在构建期就炸掉。
          PORTABLE_HITS="$(ls QuickLaunch-Portable-* 2>/dev/null || true)"
          if [ -n "$PORTABLE_HITS" ]; then
            echo "::error::CI 不应产出便携版，却发现了：$PORTABLE_HITS"
            exit 1
          fi

          {
            echo "VERSION=$VERSION"
            echo "RELEASE_DIR=$RELEASE_DIR"
            echo "SETUP=$SETUP"
            echo "GREEN=$GREEN"
          } >> "$GITHUB_ENV"

          echo "=== 产物清单 ==="
          ls -la QuickLaunch-*

      # 更新元数据（绿色版与安装版共用同一份 update.json）。
      # 客户端取的是 `<更新源>/update.json`，默认更新源 = releases/latest/download ——
      # 所以清单必须作为**同名 Release 资产**发出去。缺了它客户端只会拿到 404
      # （那是正常的"还没发清单"），用户就永远不知道有新版本。
      # ★ 差量基准 = 上一个 Release 的绿色版 zip，解开成目录喂给 make-update-manifest。
      #   拿不到就降级成"只有全量"的清单：用户照样能更新，只是要下整包 ——
      #   宁可少一条优化，也绝不因为一次网络抖动把整个 Release 卡死。
      - name: 生成更新清单（+ 差量补丁）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          DIST="../dist"
          TMP="$RUNNER_TEMP/ql-baseline"
          rm -rf "$TMP"; mkdir -p "$TMP"

          # 1) 找上一个（非草稿、非预发布）Release 里的绿色版 zip，连它的 tag 一起取出来。
          #    ★ 这里刻意不写死资产名：只按前缀/中缀/后缀三段去认，
          #      免得往工作流里再添一处"资产全名"（那处名单只该在下面 files: 里有一份）。
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=40" > "$TMP/rel.json"
          RELS="$TMP/rel.json" node -e '
            const fs = require("fs");
            const rels = JSON.parse(fs.readFileSync(process.env.RELS, "utf8"));
            const cur = process.env.GITHUB_REF_NAME;
            for (const r of rels) {
              if (!r || r.draft || r.prerelease || r.tag_name === cur) continue;
              const a = (r.assets || []).find(x =>
                typeof x.name === "string" && x.name.startsWith("QuickLaunch-") &&
                x.name.includes("-Green-") && x.name.endsWith(".zip"));
              if (a) { process.stdout.write(r.tag_name + " " + a.browser_download_url); break; }
            }
          ' > "$TMP/found.txt" || true

          FROM=""; URL=""
          if [ -s "$TMP/found.txt" ]; then
            read -r TAG URL <<< "$(cat "$TMP/found.txt")"
            FROM="${TAG#v}"
          fi

          # 2) 解开当差量基准。任一步失败都退回"只有全量"，不让它拦住发版。
          OLD_ARG=()
          if [ -n "$FROM" ] && [ -n "$URL" ]; then
            echo "差量基准：$URL"
            if curl -fsSL -o "$TMP/prev.zip" "$URL" \
               && node scripts/unpack-green.mjs --zip "$TMP/prev.zip" --out "$TMP/old"; then
              OLD_ARG=(--old "$TMP/old" --from "$FROM")
            else
              echo "::warning::差量基准下载/解包失败，本次清单不含差量（老用户会下整包）"
            fi
          else
            echo "::warning::没有可作为基准的上一个 Release，本次清单不含差量（老用户会下整包）"
          fi

          # 3) 出清单：dist/update.json + dist/QuickLaunch-Delta-<from>-to-<to>.bin
          node scripts/make-update-manifest.mjs \
            --new "$DIST/win-unpacked" --zip "$DIST/$GREEN" --out "$DIST" "${OLD_ARG[@]}"

          # 4) 自己先验一遍，别把一份坏清单发出去（客户端拿到它只会报"格式不认识"）
          test -f "$DIST/update.json" || { echo "::error::没有产出 update.json"; exit 1; }
          MANIFEST="$DIST/update.json" DIST="$DIST" node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
            console.log("清单: v" + m.version + " / 文件 " + m.files.length + " 个 / 差量 " + m.patches.length + " 条");
            if (!m.patches.length) console.log("::warning::本次没有差量补丁 —— 老用户会下整包");
            const leak = m.files.filter(f => /^(data|\.update|\.tmpdata|\.probe-shot)\//.test(f.path));
            if (leak.length) {
              console.error("::error::清单里混进了运行时文件：" + leak.slice(0, 3).map(f => f.path).join(", "));
              process.exit(1);
            }
            for (const p of m.patches) {
              if (!fs.existsSync(process.env.DIST + "/" + p.asset)) {
                console.error("::error::清单引用的差量包不在 dist 里：" + p.asset);
                process.exit(1);
              }
            }
          '

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QuickLaunch-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_DIR }}\${{ env.SETUP }}
            ${{ env.RELEASE_DIR }}\${{ env.GREEN }}

      # 发布说明就写在 annotated tag 的 message 里（`git tag -a v1.2.0 -m "…"`），
      # 这里把它取出来交给 Release 步骤 —— 说明和代码同属一个 tag，不会忘、也不必再维护
      # 一份 CHANGELOG。★ 取不到时**什么都不设**（而不是设成空串），action 会回落到
      # 自动生成的变更列表；宁可少一段话，也绝不把 git 的报错文本贴到发布页上。
      - name: 取 tag 里的发布说明
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # ★ checkout 默认是浅克隆（fetch-depth: 1），**不带 tag 对象** —— 不补这一步
          #   `git tag -l` 会安静地什么都不返回，我们就静默退化成"没有说明"。
          #   取不到也不致命（下面的回落会兜住），所以不 `|| exit`。
          git fetch --depth=1 --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}" || true

          KIND="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)"
          SUBJECT="$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null || true)"
          NOTES="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"

          printf 'RELEASE_TITLE=%s\n' "${SUBJECT:-$TAG}" >> "$GITHUB_ENV"

          if [ -z "$NOTES" ]; then
            # tag 类型为空 = 本地压根没有这个 tag 对象（补取失败）；= commit = 轻量 tag
            # （轻量 tag 天生没有 message，只能靠自动生成的变更列表）。
            echo "::warning::tag $TAG 取不到 message（本地 tag 类型=${KIND:-不存在}），Release 说明将只有自动生成的变更列表"
          else
            # 分隔符带上随机量：说明里若正好有一行等于分隔符，heredoc 会被提前截断。
            DELIM="QL_NOTES_${TAG}_$$_$(date +%s)"
            {
              echo "RELEASE_NOTES<<$DELIM"
              printf '%s\n' "$NOTES"
              echo "$DELIM"
            } >> "$GITHUB_ENV"
            echo "已取到发布说明 $(printf '%s' "$NOTES" | wc -c) 字节"
          fi

      # 推 main 不会顺带推 tag。要发版必须：git tag -a v1.2.0 -m "..." && git push origin v1.2.0
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # body 不是"覆盖"而是**前置拼接**：v3 的 prepareReleaseMutation 会把
          # `body + "\n\n" + 生成的 notes` 一起发出去，所以自动生成的变更列表还在。
          # RELEASE_NOTES 没有时表达式求值为空串 → action 视为未提供 → 只有变更列表。
          name: ${{ env.RELEASE_TITLE }}
          body: ${{ env.RELEASE_NOTES }}
          generate_release_notes: true
          # Release 只挂安装版 + 绿色版两个**程序包**（单文件便携版已按用户要求移出 CI），
          # 外加客户端的更新元数据 update.json 与差量包 —— 后两个没有就更新不了：
          # 客户端默认从 releases/latest/download 取 update.json，它不是资产就永远是 404。
          # ★ 差量包名带版本号（QuickLaunch-Delta-<from>-to-<to>.bin），所以用 glob：
          #   匹配不到时 action 默认只是跳过（fail_on_unmatched_files 默认 false），
          #   正好对上"没有基准就发全量清单"的降级路径。
          files: |
            ${{ env.RELEASE_DIR }}\${{ env.SETUP }}
            ${{ env.RELEASE_DIR }}\${{ env.GREEN }}
            ${{ env.RELEASE_DIR }}\update.json
            ${{ env.RELEASE_DIR }}\QuickLaunch-Delta-*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
